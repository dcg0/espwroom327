; DC ECU — panel web en ESP32 WROOM + ELM327 Bluetooth Classic (SPP)
; Compilar:  pio run
; Flashear:  pio run -t upload && pio run -t uploadfs
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DWEBSERVER_PORT=80
