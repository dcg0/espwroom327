; DC ECU — panel web en ESP32 WROOM + ELM327 Bluetooth Classic (SPP)
; Compilar:  pio run
; Flashear:  pio run -t upload && pio run -t uploadfs
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; El firmware y el panel superan el límite de la partición OTA estándar.
; Este proyecto se actualiza por USB/serial y no implementa OTA.
board_build.partitions = no_ota.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DWEBSERVER_PORT=80
